<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Playlist Player</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
      
      body {
        font-family: 'Noto Sans KR', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background-color: #e8e3d9;
        color: #2b2b2b;
      }
      .font-pixel { font-family: 'VT323', monospace; }

      /* Retro Cream Color Palettes matching screenshots */
      .bg-retro-cream { background-color: #e8e3d9; }
      .bg-retro-box { background-color: #dcd6cb; border: 1px solid #c9c3b7; }
      .retro-btn { background-color: #dcd6cb; border: 1px solid #b8b1a3; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

      /* iPod Wheel */
      .ipod-wheel {
        background: radial-gradient(circle at 50% 50%, #ffffff 0%, #ede8de 70%, #ded7cc 100%);
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.9), 0 8px 20px rgba(0,0,0,0.12);
      }
      .ipod-center-btn {
        background: radial-gradient(circle at 40% 40%, #ffffff 0%, #e2ded5 100%);
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      }

      /* Game Boy */
      .gb-screen {
        background-color: #8c946e;
        border: 4px solid #555d40;
        box-shadow: inset 3px 3px 8px rgba(0,0,0,0.4);
      }
      .gb-dpad {
        background-color: #1f1f1f;
        box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
      }
      .gb-btn-a {
        background: radial-gradient(circle at 35% 35%, #a61c4c 0%, #731032 100%);
        box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

    <div id="root" class="w-full max-w-md h-screen sm:h-[860px] bg-retro-cream sm:rounded-[36px] overflow-hidden shadow-2xl relative flex flex-col justify-between border-0 sm:border border-[#d2ccbf]"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // 요청하신 먼작귀 공식 유튜브 재생목록 ID
      const CHIIKAWA_PLAYLIST_ID = 'PLsmaUhkCwW3q5q46uc9So2b4D-pZqVZOV';

      const INITIAL_TRACKS = [
        { id: 'c1', title: '1화 - 먼작귀 야하! 시작되는 모험', artist: '먼작귀 공식', albumArt: 'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg', youtubeId: 'dQw4w9WgXcQ', durationSec: 1200, progressSec: 0 },
        { id: 'c2', title: '2화 - 하치와레와 풀뽑기 검정 시험', artist: '먼작귀 공식', albumArt: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=80', youtubeId: 'dQw4w9WgXcQ', durationSec: 1470, progressSec: 300 },
        { id: 'c161', title: '161화 - 새로운 장의 시작', artist: '먼작귀 공식', albumArt: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop&q=80', youtubeId: 'dQw4w9WgXcQ', durationSec: 1430, progressSec: 0 }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('home');
        const [mode, setMode] = useState('video'); // 영상 기본
        const [uiStyle, setUiStyle] = useState('ipod'); // iPod / gameboy / default
        const [libSubTab, setLibSubTab] = useState('playlists');
        const [searchSubTab, setSearchSubTab] = useState('url');

        const [user, setUser] = useState(null);
        const [playlists, setPlaylists] = useState([
          { id: 'pl-main', name: '내 재생목록', tracks: INITIAL_TRACKS }
        ]);
        const [activePlaylistId, setActivePlaylistId] = useState('pl-main');
        const [currentIndex, setCurrentIndex] = useState(0);

        const [isPlaying, setIsPlaying] = useState(false);
        const [currentTime, setCurrentTime] = useState(0);
        const [isShuffle, setIsShuffle] = useState(false);
        const [isRepeat, setIsRepeat] = useState(false);

        // 설정 옵션 상태
        const [defaultMode, setDefaultMode] = useState('영상');
        const [videoQuality, setVideoQuality] = useState('자동');
        const [soundBoost, setSoundBoost] = useState(true);
        const [volume, setVolume] = useState(100);

        const [inputUrl, setInputUrl] = useState('');
        const [inputBatchUrls, setInputBatchUrls] = useState('');
        const [feedbackType, setFeedbackType] = useState('오류');
        const [feedbackText, setFeedbackText] = useState('');

        const currentPlaylist = playlists.find(p => p.id === activePlaylistId) || playlists[0];
        const activeTracks = currentPlaylist ? currentPlaylist.tracks : [];
        const currentTrack = activeTracks[currentIndex] || INITIAL_TRACKS[0];

        // 엔딩 스킵 규칙 적용 함수
        const getEpisodeNumber = (title) => {
          const match = title ? title.match(/(\d+)\s*화/) : null;
          return match ? parseInt(match[1], 10) : null;
        };

        const getSkipThreshold = (idx, title) => {
          if (idx === 0) return 0; // 1화는 스킵 없음
          const ep = getEpisodeNumber(title);
          if (ep !== null && ep >= 161) return 35.1; // 161화 이상 35.1초 전 스킵
          return 30.1; // 그 외 30.1초 전 스킵
        };

        const handleNextTrack = () => {
          if (activeTracks.length > 1) {
            setCurrentIndex((prev) => (prev + 1) % activeTracks.length);
            setCurrentTime(0);
          }
        };

        const handlePrevTrack = () => {
          if (activeTracks.length > 1) {
            setCurrentIndex((prev) => (prev - 1 + activeTracks.length) % activeTracks.length);
            setCurrentTime(0);
          }
        };

        // 재생 타이머 및 엔딩 스킵 자동 감지
        useEffect(() => {
          let interval = null;
          if (isPlaying && currentTrack) {
            interval = setInterval(() => {
              setCurrentTime((prev) => {
                const next = prev + 1;
                
                // 재생목록 빨간 줄 이어보기 업데이트
                setPlaylists(prevPl => prevPl.map(p => p.id === activePlaylistId ? {
                  ...p,
                  tracks: p.tracks.map((t, i) => i === currentIndex ? { ...t, progressSec: next } : t)
                } : p));

                const remaining = currentTrack.durationSec - next;
                const threshold = getSkipThreshold(currentIndex, currentTrack.title);

                if (threshold > 0 && remaining <= threshold && remaining > 0) {
                  setTimeout(() => handleNextTrack(), 500);
                }

                if (next >= currentTrack.durationSec) {
                  handleNextTrack();
                  return 0;
                }
                return next;
              });
            }, 1000);
          } else {
            clearInterval(interval);
          }
          return () => clearInterval(interval);
        }, [isPlaying, currentTrack, currentIndex, activePlaylistId]);

        const formatTime = (secs) => {
          const m = Math.floor(secs / 60);
          const s = Math.floor(secs % 60);
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        return (
          <div className="w-full h-full flex flex-col justify-between p-4 bg-retro-cream text-slate-800 select-none">
            
            {/* Header */}
            <header className="flex justify-between items-center pb-3 border-b border-[#d2ccbf]">
              <h1 className="text-xl font-extrabold tracking-tight text-slate-900">Playlist Player</h1>
              <button 
                onClick={() => setUser(user ? null : { name: '고은새' })} 
                className="bg-white border border-[#c9c3b7] shadow-sm px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 hover:bg-slate-50 transition"
              >
                <span className="text-rose-500 font-black">G</span> 
                {user ? user.name : 'Google로 로그인'}
              </button>
            </header>

            {/* Main Content Area */}
            <main className="flex-1 overflow-y-auto py-3 space-y-3">
              
              {/* ==================== 홈 TAB ==================== */}
              {activeTab === 'home' && (
                <div className="flex flex-col items-center space-y-4">
                  
                  {/* 음악 / 영상 전환 탭 */}
                  <div className="w-full bg-[#d6d0c4] p-1 rounded-2xl flex border border-[#c5bfb3]">
                    <button onClick={() => setMode('music')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${mode === 'music' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>음악</button>
                    <button onClick={() => setMode('video')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${mode === 'video' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>영상</button>
                  </div>

                  {/* iPod Classic UI */}
                  {uiStyle === 'ipod' && (
                    <div className="w-full bg-[#f4f1eb] p-5 rounded-[40px] border-4 border-[#ded8cc] shadow-xl flex flex-col items-center space-y-6">
                      <div className="w-full bg-[#d2e4f2] rounded-2xl border-4 border-[#334155] p-3 shadow-inner min-h-[190px] flex flex-col justify-between relative overflow-hidden">
                        <div className="text-[11px] font-bold text-center text-slate-700 border-b border-slate-400 pb-1">iPod</div>
                        
                        {mode === 'music' ? (
                          <div className="flex items-center gap-3 my-auto">
                            <img src={currentTrack.albumArt} className="w-20 h-20 rounded-lg object-cover shadow border border-slate-400" alt="Cover" />
                            <div className="flex-1 min-w-0">
                              <h4 className="font-bold text-xs truncate text-slate-900">{currentTrack.title}</h4>
                              <p className="text-[11px] text-slate-600 truncate mt-0.5">{currentTrack.artist}</p>
                              <div className="mt-2 space-y-1">
                                <div className="w-full bg-slate-300 h-1.5 rounded-full overflow-hidden border border-slate-400">
                                  <div className="bg-red-600 h-full" style={{ width: `${(currentTime / currentTrack.durationSec) * 100}%` }}></div>
                                </div>
                                <div className="flex justify-between text-[9px] font-mono text-slate-600">
                                  <span>{formatTime(currentTime)}</span>
                                  <span>{formatTime(currentTrack.durationSec)}</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="w-full h-36 bg-black rounded-lg overflow-hidden">
                            <iframe className="w-full h-full" src={`https://www.youtube-nocookie.com/embed/videoseries?list=${CHIIKAWA_PLAYLIST_ID}&autoplay=1`} title="YouTube" allowFullScreen></iframe>
                          </div>
                        )}
                      </div>

                      {/* 3D Click Wheel */}
                      <div className="w-48 h-48 rounded-full ipod-wheel relative flex items-center justify-center">
                        <button onClick={() => setIsPlaying(!isPlaying)} className="w-16 h-16 rounded-full ipod-center-btn flex items-center justify-center text-slate-700 active:scale-95 transition">
                          <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'} text-sm`}></i>
                        </button>
                        <button onClick={() => setIsShuffle(!isShuffle)} className={`absolute top-3 text-xs ${isShuffle ? 'text-emerald-600 font-bold' : 'text-slate-500'}`}><i className="fa-solid fa-shuffle"></i></button>
                        <button onClick={handlePrevTrack} className="absolute left-4 text-slate-600"><i className="fa-solid fa-backward-step text-sm"></i></button>
                        <button onClick={handleNextTrack} className="absolute right-4 text-slate-600"><i className="fa-solid fa-forward-step text-sm"></i></button>
                        <button onClick={() => setIsRepeat(!isRepeat)} className={`absolute bottom-3 text-xs ${isRepeat ? 'text-emerald-600 font-bold' : 'text-slate-500'}`}><i className="fa-solid fa-repeat"></i></button>
                      </div>
                    </div>
                  )}

                  {/* Game Boy UI */}
                  {uiStyle === 'gameboy' && (
                    <div className="w-full bg-[#cccaa8] p-5 rounded-3xl border-4 border-[#9d9b79] shadow-xl flex flex-col items-center space-y-4 text-[#1d2610]">
                      <div className="w-full gb-screen rounded-xl p-3 relative">
                        <div className="flex justify-between items-center text-[9px] font-pixel font-bold text-[#2d331e] pb-1 border-b border-[#6e7555] mb-2 tracking-widest">
                          <span>DOT MATRIX STEREO</span>
                          <span className="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                        </div>
                        <div className="bg-[#9ea680] border-2 border-[#6f7753] rounded p-2">
                          {mode === 'music' ? (
                            <div className="space-y-2 font-pixel">
                              <div className="flex items-center gap-2">
                                <img src={currentTrack.albumArt} className="w-12 h-12 rounded border border-[#52573e] object-cover" alt="Art" />
                                <div className="min-w-0">
                                  <h4 className="font-bold text-xs truncate">{currentTrack.title}</h4>
                                  <p className="text-[10px] opacity-80">{currentTrack.artist}</p>
                                </div>
                              </div>
                              <div className="space-y-1">
                                <div className="w-full bg-[#6d7353] h-2 rounded overflow-hidden">
                                  <div className="bg-red-600 h-full" style={{ width: `${(currentTime / currentTrack.durationSec) * 100}%` }}></div>
                                </div>
                                <div className="flex justify-between text-xs">
                                  <span>{formatTime(currentTime)}</span>
                                  <span>{formatTime(currentTrack.durationSec)}</span>
                                </div>
                              </div>
                            </div>
                          ) : (
                            <div className="w-full h-36 bg-black rounded overflow-hidden">
                              <iframe className="w-full h-full" src={`https://www.youtube-nocookie.com/embed/videoseries?list=${CHIIKAWA_PLAYLIST_ID}&autoplay=1`} title="YouTube" allowFullScreen></iframe>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="w-full flex justify-between items-center px-2 pt-2">
                        <div className="relative w-20 h-20 flex items-center justify-center">
                          <div className="w-7 h-20 gb-dpad rounded-md absolute"></div>
                          <div className="w-20 h-7 gb-dpad rounded-md absolute"></div>
                          <button onClick={handlePrevTrack} className="absolute left-1 text-slate-300 text-xs"><i className="fa-solid fa-caret-left"></i></button>
                          <button onClick={handleNextTrack} className="absolute right-1 text-slate-300 text-xs"><i className="fa-solid fa-caret-right"></i></button>
                        </div>
                        <div className="flex gap-3 rotate-[-15deg]">
                          <button onClick={() => setIsPlaying(!isPlaying)} className="w-12 h-12 rounded-full gb-btn-a text-white font-bold flex items-center justify-center text-sm">
                            {isPlaying ? <i className="fa-solid fa-pause"></i> : <i className="fa-solid fa-play ml-0.5"></i>}
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 기본 UI */}
                  {uiStyle === 'default' && (
                    <div className="w-full space-y-3 pt-2">
                      <div className="w-full aspect-video rounded-3xl overflow-hidden shadow bg-black border border-[#c9c3b7]">
                        <iframe className="w-full h-full" src={`https://www.youtube-nocookie.com/embed/videoseries?list=${CHIIKAWA_PLAYLIST_ID}&autoplay=1`} title="YouTube" allowFullScreen></iframe>
                      </div>
                      <div className="text-center">
                        <h3 className="font-extrabold text-sm truncate">{currentTrack.title}</h3>
                        <p className="text-xs opacity-60 mt-0.5">{currentTrack.artist}</p>
                      </div>
                    </div>
                  )}

                </div>
              )}

              {/* ==================== 보관함 TAB ==================== */}
              {activeTab === 'library' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-lg font-bold">보관함</h2>
                    <button className="text-xs font-bold text-slate-600">+ 새 목록</button>
                  </div>

                  <div className="flex bg-[#d6d0c4] p-1 rounded-2xl border border-[#c5bfb3] text-xs font-bold">
                    <button onClick={() => setLibSubTab('playlists')} className={`flex-1 py-1.5 rounded-xl transition ${libSubTab === 'playlists' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>재생목록</button>
                    <button onClick={() => setLibSubTab('queue')} className={`flex-1 py-1.5 rounded-xl transition ${libSubTab === 'queue' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>다음 재생</button>
                    <button onClick={() => setLibSubTab('history')} className={`flex-1 py-1.5 rounded-xl transition ${libSubTab === 'history' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>시청 기록</button>
                  </div>

                  {libSubTab === 'playlists' && (
                    <div className="space-y-3">
                      <div className="bg-retro-box p-4 rounded-2xl flex justify-between items-center shadow-sm">
                        <div>
                          <h4 className="font-bold text-sm">내 재생목록</h4>
                          <p className="text-xs text-slate-500 mt-0.5">먼작귀 공식 재생목록 연동됨 ({activeTracks.length}곡)</p>
                        </div>
                        <div className="flex gap-3 text-slate-500">
                          <button><i className="fa-solid fa-pen"></i></button>
                          <button><i className="fa-solid fa-trash"></i></button>
                        </div>
                      </div>

                      <div className="space-y-2">
                        {activeTracks.map((item, idx) => (
                          <div key={item.id} onClick={() => { setCurrentIndex(idx); setIsPlaying(true); setActiveTab('home'); }} className={`p-3 rounded-2xl flex items-center gap-3 cursor-pointer border transition ${idx === currentIndex ? 'bg-white border-rose-300 shadow-sm' : 'bg-retro-box border-[#c9c3b7]'}`}>
                            <img src={item.albumArt} className="w-12 h-12 rounded-xl object-cover" alt="Art" />
                            <div className="flex-1 min-w-0">
                              <h4 className="font-bold text-xs truncate">{item.title}</h4>
                              <p className="text-[11px] opacity-60 mt-0.5">{item.artist}</p>
                              <div className="w-full bg-[#c9c3b7] h-1.5 rounded-full mt-2 overflow-hidden">
                                <div className="bg-red-600 h-full" style={{ width: `${(item.progressSec / item.durationSec) * 100}%` }}></div>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ==================== 검색 TAB ==================== */}
              {activeTab === 'search' && (
                <div className="space-y-4">
                  <h2 className="text-lg font-bold">추가 · 검색</h2>

                  <div className="flex bg-[#d6d0c4] p-1 rounded-2xl border border-[#c5bfb3] text-xs font-bold">
                    <button onClick={() => setSearchSubTab('url')} className={`flex-1 py-1.5 rounded-xl transition ${searchSubTab === 'url' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>URL</button>
                    <button onClick={() => setSearchSubTab('search')} className={`flex-1 py-1.5 rounded-xl transition ${searchSubTab === 'search' ? 'bg-white shadow text-slate-900' : 'text-slate-600'}`}>검색</button>
                  </div>

                  {searchSubTab === 'url' && (
                    <div className="space-y-3">
                      <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                        <label className="text-xs font-bold text-slate-600">재생목록 선택</label>
                        <select className="w-full p-2.5 bg-white rounded-xl text-xs font-bold border border-[#c9c3b7] outline-none">
                          <option>내 재생목록</option>
                        </select>
                      </div>

                      <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                        <label className="text-xs font-bold text-slate-600">영상 / 재생목록 / 채널 URL</label>
                        <input type="text" value={inputUrl} onChange={(e) => setInputUrl(e.target.value)} placeholder="youtu.be/... · list=PL... · @채널" className="w-full p-2.5 bg-white rounded-xl text-xs border border-[#c9c3b7] outline-none" />
                        <div className="grid grid-cols-3 gap-2 pt-1">
                          <button className="py-2 bg-[#d6d0c4] border border-[#b8b1a3] rounded-xl text-xs font-bold">재생</button>
                          <button className="py-2 bg-[#d6d0c4] border border-[#b8b1a3] rounded-xl text-xs font-bold">다음 재생</button>
                          <button className="py-2 bg-[#d6d0c4] border border-[#b8b1a3] rounded-xl text-xs font-bold">목록 추가</button>
                        </div>
                      </div>

                      <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                        <div className="flex justify-between items-center">
                          <label className="text-xs font-bold text-slate-600">여러 URL 추가</label>
                          <span className="text-[10px] text-slate-500">한 줄에 하나</span>
                        </div>
                        <textarea value={inputBatchUrls} onChange={(e) => setInputBatchUrls(e.target.value)} placeholder="영상 URL&#10;재생목록 URL (list=PL...)&#10;채널 URL (youtube.com/@...)" className="w-full h-24 p-2.5 bg-white rounded-xl text-xs border border-[#c9c3b7] outline-none resize-none"></textarea>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ==================== 설정 TAB ==================== */}
              {activeTab === 'settings' && (
                <div className="space-y-4">
                  <h2 className="text-lg font-bold">설정</h2>
                  
                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-1">
                    <span className="text-[11px] font-bold text-slate-500">이용 권한</span>
                    <p className="text-xs font-bold">로그인 없이 이용 가능</p>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <span className="text-[11px] font-bold text-slate-500">계정</span>
                    <button onClick={() => setUser(user ? null : { name: '고은새' })} className="w-full py-2.5 bg-[#8b1d43] text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow">
                      <span className="font-black">G</span> {user ? 'Google 로그아웃' : 'Google로 로그인'}
                    </button>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <span className="text-[11px] font-bold text-slate-500">동기화</span>
                    <p className="text-xs font-bold">로그인하면 Cloudflare D1 동기화</p>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <label className="text-xs font-bold text-slate-600">기본 모드</label>
                    <select value={defaultMode} onChange={(e) => setDefaultMode(e.target.value)} className="w-full p-2.5 bg-white rounded-xl text-xs font-bold border border-[#c9c3b7] outline-none">
                      <option value="음악">음악</option>
                      <option value="영상">영상</option>
                    </select>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <label className="text-xs font-bold text-slate-600">UI 스타일</label>
                    <select value={uiStyle} onChange={(e) => setUiStyle(e.target.value)} className="w-full p-2.5 bg-white rounded-xl text-xs font-bold border border-[#c9c3b7] outline-none">
                      <option value="default">기본</option>
                      <option value="ipod">iPod</option>
                      <option value="gameboy">Game Boy</option>
                    </select>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <label className="text-xs font-bold text-slate-600">영상 화질</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => setVideoQuality('자동')} className={`py-2 rounded-xl text-xs font-bold border ${videoQuality === '자동' ? 'bg-[#828c5a] text-white border-transparent' : 'bg-white border-[#c9c3b7]'}`}>자동</button>
                      <button onClick={() => setVideoQuality('최대 화질')} className={`py-2 rounded-xl text-xs font-bold border ${videoQuality === '최대 화질' ? 'bg-[#828c5a] text-white border-transparent' : 'bg-white border-[#c9c3b7]'}`}>최대 화질</button>
                    </div>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <div className="flex justify-between items-center">
                      <label className="text-xs font-bold text-slate-600">음량 증폭</label>
                      <span className="text-xs font-mono font-bold">{volume}%</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <button onClick={() => setSoundBoost(!soundBoost)} className={`px-4 py-1.5 rounded-lg text-xs font-bold border ${soundBoost ? 'bg-stone-300 border-stone-400' : 'bg-white border-[#c9c3b7]'}`}>
                        {soundBoost ? '켜기' : '끄기'}
                      </button>
                      <input type="range" min="50" max="200" value={volume} onChange={(e) => setVolume(e.target.value)} className="flex-1 accent-stone-700" />
                    </div>
                  </div>

                  <div className="bg-retro-box p-3.5 rounded-2xl space-y-2">
                    <label className="text-xs font-bold text-slate-600">피드백 · 오류</label>
                    <select value={feedbackType} onChange={(e) => setFeedbackType(e.target.value)} className="w-full p-2.5 bg-white rounded-xl text-xs font-bold border border-[#c9c3b7] outline-none">
                      <option value="오류">오류</option>
                      <option value="건의">건의</option>
                    </select>
                    <textarea value={feedbackText} onChange={(e) => setFeedbackText(e.target.value)} placeholder="무슨 일이 있었는지 적어주세요" className="w-full h-20 p-2.5 bg-white rounded-xl text-xs border border-[#c9c3b7] outline-none resize-none"></textarea>
                  </div>
                </div>
              )}

            </main>

            {/* Bottom Nav Bar */}
            <nav className="flex justify-around items-center pt-3 pb-1 border-t border-[#d2ccbf] text-xs font-semibold">
              {[
                { id: 'home', label: '홈', icon: 'fa-house' },
                { id: 'library', label: '보관함', icon: 'fa-box-archive' },
                { id: 'search', label: '검색', icon: 'fa-magnifying-glass' },
                { id: 'settings', label: '설정', icon: 'fa-gear' }
              ].map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center gap-1 transition ${activeTab === item.id ? 'text-slate-900 font-bold' : 'opacity-50 hover:opacity-100'}`}>
                  <i className={`fa-solid ${item.icon} text-base`}></i>
                  <span className="text-[10px]">{item.label}</span>
                </button>
              ))}
            </nav>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
